  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go Back" class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><img alt="Vault Icon" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrBRm9E5ZUJK1CX2Nc9YEDeRseFq7_oor6PWcGPed_mHxePXvt0kxNuhL6HLcszINFEhCQZxW7IJQ2rGxRwkzm8vlVcCbaJbr_e-LiJFUgRJQFM8RZdQpWeQPHEjSeVU-1eLCmEoK0G4u3Pia4-1Z4OFSgaThIKAKovgWdfng0HK4n0BJzjW7rrSdloe5U4Ju1t82DVNE0p_0V6kinR0TbtUOxljEmJFMcKwv4iz6g"/><h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface uppercase">Send Flow</h1></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqIOCAmZA7iDXsSttxNm8D59MLtryQOD5bYZ4qql_8za31hnef0ZKyFVFFeP0NPKf40nOAdhey9tNsZp573abpwV-yvmnfYJbkl_xT8nZ9sZ1UK9xcTY3MMSlCCfMvoSv-zMqhh3fEYIs8hoVMYFux61OdVDp4PMh0LLD-1pMDTN-qJkYdyohy8ZBkWV9vAnZ0ZXovRgLj-gs5Q_shdclkvPBX1-QFGz063uiO3Vg"/></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe min-h-screen bg-surface"><div class="flex flex-col w-full px-margin pb-6 justify-between select-none">
<!-- Subtle ambient glow background element -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Top Hero Display Section -->
<div class="flex flex-col items-center justify-center pt-4 pb-2 text-center">
<!-- Value Display Container -->
<div class="relative flex items-baseline justify-center cursor-pointer transition-transform active:scale-95 duration-150">
<span class="font-display-hero-mobile text-display-hero-mobile tracking-tight text-on-surface select-all" id="display-val">$1</span>
</div>
<!-- Currency & Secondary Converted Value -->
<div class="flex flex-col items-center gap-0.5 mt-1">
<span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">USD</span>
<div class="flex items-center gap-1.5 text-secondary">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-body-sm text-body-sm tracking-tight" id="conversion-val">≈ 1.00 USDC</span>
<span class="font-label-sm text-label-sm text-primary px-1.5 py-0.5 rounded-full bg-primary-container/10 font-medium">Free instant</span>
</div>
</div>
<!-- Funding Source Selector Capsule -->
<div class="mt-6 w-full max-w-xs">
<button class="w-full flex items-center justify-between px-4 py-2.5 rounded-full bg-surface-container-low hover:bg-surface-container active:scale-[0.98] transition-all duration-200" id="source-toggle-btn">
<div class="flex items-center gap-2.5">
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div class="flex items-baseline gap-2">
<span class="font-label-md text-label-md text-on-surface">Onyx •• 4821</span>
<span class="font-body-sm text-body-sm text-secondary" id="account-balance">$478.00</span>
</div>
</div>
<span class="material-symbols-outlined text-[18px] text-secondary transition-transform duration-200" id="source-chevron">unfold_more</span>
</button>
<!-- Collapsible Quick Source Drawer -->
<div class="hidden flex-col gap-1.5 mt-2 p-2 bg-surface-container-low rounded-2xl transition-all duration-200" id="source-drawer">
<div class="flex items-center justify-between p-2 rounded-xl bg-surface-container-high cursor-pointer" onclick="selectSource('Onyx •• 4821', '$478.00')">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">credit_card</span>
<span class="font-label-sm text-label-sm text-on-surface">Onyx Card (Primary)</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface">$478.00</span>
</div>
<div class="flex items-center justify-between p-2 rounded-xl hover:bg-surface-container cursor-pointer transition-colors" onclick="selectSource('Chase •• 9012', '$2,140.50')">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[18px]">account_balance</span>
<span class="font-label-sm text-label-sm text-secondary">Checking Account</span>
</div>
<span class="font-body-sm text-body-sm text-secondary">$2,140.50</span>
</div>
</div>
</div>
</div>
<!-- High-Ergonomic Numeric Keypad -->
<div class="w-full max-w-sm mx-auto my-2">
<div class="grid grid-cols-3 gap-y-3 gap-x-2 text-center">
<!-- 1 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('1')">1</button>
<!-- 2 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('2')">2</button>
<!-- 3 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('3')">3</button>
<!-- 4 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('4')">4</button>
<!-- 5 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('5')">5</button>
<!-- 6 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('6')">6</button>
<!-- 7 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('7')">7</button>
<!-- 8 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('8')">8</button>
<!-- 9 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('9')">9</button>
<!-- Decimal Point -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100 leading-none" onclick="pressKey('.')">.</button>
<!-- 0 -->
<button class="h-16 flex items-center justify-center rounded-2xl font-keypad-num text-keypad-num text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressKey('0')">0</button>
<!-- Backspace -->
<button aria-label="Backspace" class="h-16 flex items-center justify-center rounded-2xl text-on-surface active:bg-surface-container-highest transition-colors duration-100" onclick="pressBackspace()">
<span class="material-symbols-outlined text-[26px]">arrow_back</span>
</button>
</div>
</div>
<!-- Swipe-to-Top-up Track Pill -->
<div class="w-full max-w-sm mx-auto pt-2">
<div class="relative w-full h-16 bg-surface-container-low rounded-full flex items-center p-1.5 overflow-hidden select-none" id="swipe-track">
<!-- Fill dynamic color track during swipe -->
<div class="absolute left-0 top-0 bottom-0 bg-primary/20 rounded-full w-16 pointer-events-none transition-all duration-75" id="swipe-progress-fill"></div>
<!-- Action Track Text -->
<div class="w-full text-center pr-4 font-label-md text-label-md text-secondary pointer-events-none transition-opacity duration-200" id="swipe-label">
        Swipe to top up <span class="text-on-surface font-semibold" id="btn-amount-label">$1</span> »
      </div>
<!-- Circular Draggable Thumb -->
<div class="absolute left-1.5 top-1.5 bottom-1.5 w-13 h-13 aspect-square bg-on-surface text-surface flex items-center justify-center rounded-full shadow-md cursor-grab active:cursor-grabbing touch-none z-10" id="swipe-thumb">
<span class="material-symbols-outlined text-[22px] transition-transform duration-200" id="thumb-icon">arrow_forward</span>
</div>
</div>
</div>
<!-- Feedback Modal Toast (Hidden by default) -->
<div class="fixed inset-x-margin bottom-8 mx-auto max-w-sm bg-primary-container text-on-primary-container rounded-2xl p-4 shadow-xl transform translate-y-32 opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-3" id="success-banner">
<div class="w-10 h-10 rounded-full bg-on-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[24px]">check_circle</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm leading-tight">Deposit Success!</span>
<span class="font-body-sm text-body-sm opacity-90 truncate" id="success-subtext">Added $1 into your wallet balance</span>
</div>
</div>
</div>
<script>
  let rawAmount = "1";

  function updateDisplays() {
    const displayVal = document.getElementById('display-val');
    const conversionVal = document.getElementById('conversion-val');
    const btnAmountLabel = document.getElementById('btn-amount-label');

    let formatted = rawAmount === "" ? "0" : rawAmount;
    displayVal.textContent = "$" + formatted;
    
    let numVal = parseFloat(formatted);
    if (isNaN(numVal)) numVal = 0;
    
    conversionVal.textContent = `≈ ${numVal.toFixed(2)} USDC`;
    btnAmountLabel.textContent = "$" + (formatted === "0" ? "0" : formatted);
  }

  function pressKey(val) {
    if (val === '.') {
      if (!rawAmount.includes('.')) {
        rawAmount = rawAmount === "" ? "0." : rawAmount + ".";
      }
    } else {
      if (rawAmount === "0" && val !== '.') {
        rawAmount = val;
      } else if (rawAmount.includes('.') && rawAmount.split('.')[1].length >= 2) {
        return; // Max 2 decimal positions
      } else if (rawAmount.length < 8) {
        rawAmount += val;
      }
    }
    updateDisplays();
  }

  function pressBackspace() {
    if (rawAmount.length > 0) {
      rawAmount = rawAmount.slice(0, -1);
      if (rawAmount === "") {
        rawAmount = "0";
      }
    } else {
      rawAmount = "0";
    }
    updateDisplays();
  }

  // Account selector drawer toggle
  const sourceBtn = document.getElementById('source-toggle-btn');
  const sourceDrawer = document.getElementById('source-drawer');
  const sourceChevron = document.getElementById('source-chevron');

  sourceBtn.addEventListener('click', () => {
    const isOpen = !sourceDrawer.classList.contains('hidden');
    if (isOpen) {
      sourceDrawer.classList.add('hidden');
      sourceDrawer.classList.remove('flex');
      sourceChevron.style.transform = 'rotate(0deg)';
    } else {
      sourceDrawer.classList.remove('hidden');
      sourceDrawer.classList.add('flex');
      sourceChevron.style.transform = 'rotate(180deg)';
    }
  });

  function selectSource(name, balance) {
    document.querySelector('#source-toggle-btn span.font-label-md').textContent = name;
    document.getElementById('account-balance').textContent = balance;
    sourceDrawer.classList.add('hidden');
    sourceDrawer.classList.remove('flex');
    sourceChevron.style.transform = 'rotate(0deg)';
  }

  // Swipe-to-Top-Up Interaction logic
  const track = document.getElementById('swipe-track');
  const thumb = document.getElementById('swipe-thumb');
  const fill = document.getElementById('swipe-progress-fill');
  const label = document.getElementById('swipe-label');
  const thumbIcon = document.getElementById('thumb-icon');
  const successBanner = document.getElementById('success-banner');
  const successSubtext = document.getElementById('success-subtext');

  let isDragging = false;
  let startX = 0;
  let maxDistance = 0;

  function setThumbPosition(x) {
    thumb.style.transform = `translateX(${x}px)`;
    fill.style.width = `${x + thumb.offsetWidth}px`;
    label.style.opacity = `${Math.max(0, 1 - (x / (maxDistance * 0.7)))}`;
  }

  function onDragStart(clientX) {
    const amountVal = parseFloat(rawAmount || "0");
    if (amountVal <= 0) return;
    
    isDragging = true;
    startX = clientX;
    maxDistance = track.clientWidth - thumb.clientWidth - 12;
    thumb.classList.remove('transition-all');
    fill.classList.remove('transition-all');
  }

  function onDragMove(clientX) {
    if (!isDragging) return;
    const delta = clientX - startX;
    const clampedX = Math.min(Math.max(0, delta), maxDistance);
    setThumbPosition(clampedX);

    if (clampedX >= maxDistance * 0.95) {
      triggerSuccess();
    }
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    thumb.classList.add('transition-all', 'duration-200');
    fill.classList.add('transition-all', 'duration-200');
    setThumbPosition(0);
  }

  function triggerSuccess() {
    isDragging = false;
    thumbIcon.textContent = 'check';
    thumb.classList.add('bg-primary-container', 'text-on-primary-container');
    thumb.style.transform = `translateX(${maxDistance}px)`;
    fill.style.width = '100%';

    successSubtext.textContent = `Added $${rawAmount} into your wallet`;
    successBanner.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
    successBanner.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      // Reset state gracefully after confirmation
      thumb.classList.remove('transition-all', 'bg-primary-container', 'text-on-primary-container');
      thumbIcon.textContent = 'arrow_forward';
      setThumbPosition(0);
      successBanner.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
      successBanner.classList.remove('translate-y-0', 'opacity-100');
      rawAmount = "0";
      updateDisplays();
    }, 2400);
  }

  // Pointer & Touch Event Handlers
  thumb.addEventListener('mousedown', (e) => onDragStart(e.clientX));
  window.addEventListener('mousemove', (e) => onDragMove(e.clientX));
  window.addEventListener('mouseup', onDragEnd);

  thumb.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
  window.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientX), { passive: true });
  window.addEventListener('touchend', onDragEnd);
</script></main></body></html>
